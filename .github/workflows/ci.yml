name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:

  # ── 1. Backend: build + EF migrations + xUnit integration tests ─────────────
  backend-tests:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_lk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aegis_lk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=aegis_lk_ci;Username=postgres;Password=postgres"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend dependencies
        run: dotnet restore "${{ github.workspace }}/backend/Aegis.Tests/Aegis.Tests.csproj"

      - name: Build API startup project
        run: dotnet build "${{ github.workspace }}/backend/Aegis.Api/Aegis.Api.csproj" --configuration Debug --no-restore

      - name: Build test project
        run: dotnet build "${{ github.workspace }}/backend/Aegis.Tests/Aegis.Tests.csproj" --configuration Debug --no-restore

      - name: Verify API build output
        run: |
          test -f "${{ github.workspace }}/backend/Aegis.Api/bin/Debug/net10.0/Aegis.Api.deps.json"
          test -f "${{ github.workspace }}/backend/Aegis.Api/bin/Debug/net10.0/Aegis.Api.dll"

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply Auth database migrations
        run: >
          dotnet ef database update
          --project "${{ github.workspace }}/backend/Aegis.Shared/Aegis.Shared.csproj"
          --startup-project "${{ github.workspace }}/backend/Aegis.Api/Aegis.Api.csproj"
          --context AuthDbContext
          --no-build

      - name: Apply Weather database migrations
        run: >
          dotnet ef database update
          --project "${{ github.workspace }}/backend/Aegis.Weather/Aegis.Weather.csproj"
          --startup-project "${{ github.workspace }}/backend/Aegis.Api/Aegis.Api.csproj"
          --context WeatherDbContext
          --no-build

      - name: Apply Incident database migrations
        run: >
          dotnet ef database update
          --project "${{ github.workspace }}/backend/Aegis.Incident/Aegis.Incident.csproj"
          --startup-project "${{ github.workspace }}/backend/Aegis.Api/Aegis.Api.csproj"
          --context IncidentDbContext
          --no-build

      - name: Apply Recovery database migrations
        run: >
          dotnet ef database update
          --project "${{ github.workspace }}/backend/Aegis.Recovery/Aegis.Recovery.csproj"
          --startup-project "${{ github.workspace }}/backend/Aegis.Api/Aegis.Api.csproj"
          --context RecoveryDbContext
          --no-build

      - name: Apply Resource database migrations
        run: >
          dotnet ef database update
          --project "${{ github.workspace }}/backend/Aegis.Resource/Aegis.Resource.csproj"
          --startup-project "${{ github.workspace }}/backend/Aegis.Api/Aegis.Api.csproj"
          --context ResourceDbContext
          --no-build

      - name: Run xUnit tests
        run: >
          dotnet test
          "${{ github.workspace }}/backend/Aegis.Tests/Aegis.Tests.csproj"
          --configuration Debug
          --verbosity normal
          --no-restore
          --no-build

  # ── 2. Python: Weather Agent deterministic guardrail tests ──────────────────
  #    Does NOT require a live Gemini API key.
  #    validate_and_decide() is pure Python — no LLM call is made during these tests.
  weather-agent-guardrails:
    name: Weather Agent Guardrail Tests (Python)
    runs-on: ubuntu-latest

    env:
      # Set to empty so dotenv / langchain_google_genai don't raise on missing key.
      # The guardrail tests never instantiate ChatGoogleGenerativeAI.
      GOOGLE_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-guardrails-${{ hashFiles('agentic-ai/agents/requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-guardrails-

      - name: Install CI dependencies
        working-directory: "${{ github.workspace }}/agentic-ai/agents"
        run: pip install -r requirements-ci.txt

      - name: Run Weather Agent guardrail tests
        working-directory: "${{ github.workspace }}/agentic-ai/agents"
        run: |
          python -m pytest test_weather_agent_guardrails.py \
            --tb=short \
            --no-header \
            -v

  # ── 3. Flutter: static analysis ─────────────────────────────────────────────
  flutter-analyze:
    name: Flutter Lint & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: "${{ github.workspace }}/flutter"
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: "${{ github.workspace }}/flutter"
        run: flutter analyze --no-fatal-infos

  # ── 4. Flutter: unit & widget tests ─────────────────────────────────────────
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            ${{ github.workspace }}/flutter/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        working-directory: "${{ github.workspace }}/flutter"
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: "${{ github.workspace }}/flutter"
        # --no-sound-null-safety is NOT used — the project is fully null-safe.
        # The widget test mocks flutter_secure_storage's platform channel
        # so it runs cleanly on headless Linux without a system keyring.
        run: flutter test --reporter expanded
