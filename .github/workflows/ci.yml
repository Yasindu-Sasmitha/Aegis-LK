name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  backend-tests:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_lk
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aegis_lk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Aegis.Tests/Aegis.Tests.csproj

      - name: Run xUnit Tests
        env:
            ConnectionStrings__DefaultConnection: "Host=localhost;Port=5433;Database=aegis_lk;Username=postgres;Password=postgres"
        run: dotnet test backend/Aegis.Tests/Aegis.Tests.csproj --verbosity normal --no-restore

  flutter-analyze:
    name: Flutter Lint & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./flutter
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: ./flutter
        run: flutter analyze --no-fatal-infos
