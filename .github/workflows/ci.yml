name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  backend-tests:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_lk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Aegis.Tests/Aegis.Tests.csproj

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply database migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=aegis_lk_ci;Username=postgres;Password=postgres"
        run: |
          export PATH="$PATH:/root/.dotnet/tools"
          dotnet ef database update \
            --project backend/Aegis.Weather/Aegis.Weather.csproj \
            --startup-project backend/Aegis.Api/Aegis.Api.csproj \
            --context WeatherDbContext

          dotnet ef database update \
            --project backend/Aegis.Shared/Aegis.Shared.csproj \
            --startup-project backend/Aegis.Api/Aegis.Api.csproj \
            --context AuthDbContext

      - name: Run xUnit Tests
        run: dotnet test backend/Aegis.Tests/Aegis.Tests.csproj --verbosity normal --no-restore
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=aegis_lk_ci;Username=postgres;Password=postgres"
  flutter-analyze:
    name: Flutter Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./flutter
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: ./flutter
        run: flutter analyze --no-fatal-infos
